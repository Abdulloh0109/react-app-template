<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0F1115" />
    <title>React App Template</title>
    <script>
      // Applies the persisted theme before first paint so a dark-theme reload
      // never flashes white. Mirrors src/store/themeStore — keep in sync.
      ;(function () {
        try {
          var raw = localStorage.getItem('theme-preference')
          var preference = raw ? JSON.parse(raw).state.preference : 'system'
          var isDark =
            preference === 'dark' ||
            (preference === 'system' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.toggle('dark', isDark)
          document.documentElement.style.colorScheme = isDark
            ? 'dark'
            : 'light'
        } catch (e) {
          /* localStorage unavailable (private mode) — fall back to light */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
